services:
  - type: web
    name: vnuk-canvas-hub
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      - key: GEMINI_MODE
        value: "low"
